<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog posts by Shiv Gurjar.">
  <meta name="theme-color" content="#42a5f5">
  <title>Blog | Shiv Gurjar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17212b;
      --muted: #263b4d;
      --paper: #42a5f5;
      --rule: rgba(23, 33, 43, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Newsreader', Georgia, serif;
      line-height: 1.6;
    }

    .page {
      width: min(940px, 100%);
      margin: 0 auto;
      padding: 38px 28px 64px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 0.98rem;
      text-decoration: none;
    }

    .back-link:hover, .post-link:hover { text-decoration: underline; }

    h1 {
      margin: 0 0 24px;
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.2;
    }

    .post-list {
      max-width: 760px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .post-list li { margin: 0 0 24px; }

    .post-link {
      color: var(--ink);
      font-size: 1.45rem;
      font-weight: 500;
      line-height: 1.3;
      text-decoration: none;
    }

    .post-date {
      display: block;
      color: var(--muted);
      font: 0.96rem Arial, sans-serif;
      margin-top: 3px;
    }

    .status { color: var(--muted); }
    .post-body { max-width: 720px; font-size: 1.12rem; overflow-wrap: anywhere; }
    .post-body h2, .post-body h3 { line-height: 1.3; margin: 1.5em 0 0.5em; }
    .post-body p { margin: 0 0 1em; }
    .post-body ul { padding-left: 1.4em; }
    .post-body blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--rule); color: var(--muted); }
    .post-body pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 14px; background: rgba(255,255,255,.25); border-radius: 6px; }
    .post-body code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .post-body img { max-width: 100%; height: auto; }

    @media (max-width: 600px) {
      .page { padding: 28px 20px 48px; }
      .post-link { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" id="back-link" href="index.html">← Home</a>
    <h1 id="page-title">Blog</h1>
    <p class="status" id="status">Loading posts…</p>
    <ul class="post-list" id="post-list" aria-label="Blog posts"></ul>
    <article class="post-body" id="post-body" hidden></article>
  </main>

  <script>
    (async function () {
      const owner = 'Shxvrr';
      const repo = 'website';
      // GitHub Pages serves the main branch. Support either folder capitalization.
      const folders = ['blogs', 'Blogs'];
      const list = document.getElementById('post-list');
      const status = document.getElementById('status');
      const title = document.getElementById('page-title');
      const body = document.getElementById('post-body');
      const back = document.getElementById('back-link');
      let posts = [];

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, (char) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
      }

      function inlineMarkdown(text) {
        let html = escapeHtml(text);
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        return html;
      }

      function parseMarkdown(markdown) {
        const frontMatter = markdown.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n|$)/);
        const metadata = {};
        let content = markdown;
        if (frontMatter) {
          frontMatter[1].split(/\r?\n/).forEach((line) => {
            const field = line.match(/^([\w-]+):\s*(.*?)\s*$/);
            if (field) metadata[field[1].toLowerCase()] = field[2].replace(/^['"]|['"]$/g, '');
          });
          content = markdown.slice(frontMatter[0].length);
        }

        const lines = content.replace(/\r\n/g, '\n').split('\n');
        const output = [];
        let paragraph = [];
        let items = [];
        let code = null;
        const flushParagraph = () => {
          if (paragraph.length) output.push(`<p>${paragraph.map(inlineMarkdown).join('<br>')}</p>`);
          paragraph = [];
        };
        const flushList = () => {
          if (items.length) output.push(`<ul>${items.map(item => `<li>${inlineMarkdown(item)}</li>`).join('')}</ul>`);
          items = [];
        };

        for (const line of lines) {
          if (code) {
            if (/^\s*```/.test(line)) {
              output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
              code = null;
            } else code.push(line);
            continue;
          }
          if (/^\s*```/.test(line)) { flushParagraph(); flushList(); code = []; continue; }
          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            flushParagraph(); flushList();
            const level = Math.min(heading[1].length + 1, 6);
            output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }
          const item = line.match(/^\s*[-*+]\s+(.+)$/);
          if (item) { flushParagraph(); items.push(item[1]); continue; }
          const quote = line.match(/^>\s?(.*)$/);
          if (quote) { flushParagraph(); flushList(); output.push(`<blockquote><p>${inlineMarkdown(quote[1])}</p></blockquote>`); continue; }
          if (!line.trim()) { flushParagraph(); flushList(); continue; }
          flushList(); paragraph.push(line);
        }
        if (code) output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
        flushParagraph(); flushList();
        return { metadata, html: output.join('\n') };
      }

      function formatDate(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
      }

      async function loadFiles(folder) {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}?ref=main`;
        const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
        if (!response.ok) throw new Error(`Could not load ${folder}/ (${response.status}).`);
        const entries = await response.json();
        return entries.filter(entry => entry.type === 'file' && /\.md$/i.test(entry.name));
      }

      function renderList() {
        title.textContent = 'Blog';
        back.href = 'index.html';
        back.textContent = '← Home';
        body.hidden = true;
        list.hidden = false;
        list.replaceChildren();
        status.hidden = true;

        if (!posts.length) {
          status.textContent = 'No Markdown posts found in the blogs folder yet.';
          status.hidden = false;
          return;
        }

        posts.forEach((post, index) => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.className = 'post-link';
          link.href = `#post-${index}`;
          link.textContent = post.title;
          const date = document.createElement('span');
          date.className = 'post-date';
          date.textContent = post.date;
          item.append(link, date);
          list.appendChild(item);
        });
      }

      async function renderRoute() {
        const match = location.hash.match(/^#post-(\d+)$/);
        if (!match) { renderList(); return; }
        const post = posts[Number(match[1])];
        if (!post) { location.hash = ''; return; }

        list.hidden = true;
        status.hidden = false;
        status.textContent = 'Loading post…';
        body.hidden = true;
        title.textContent = post.title;
        back.href = 'blog.html';
        back.textContent = '← All posts';
        try {
          const response = await fetch(post.downloadUrl);
          if (!response.ok) throw new Error(`Could not load ${post.filename}.`);
          const parsed = parseMarkdown(await response.text());
          body.innerHTML = parsed.html;
          status.hidden = true;
          body.hidden = false;
        } catch (error) {
          status.textContent = 'Could not load this Markdown post. Check the browser console for details.';
          console.error(error);
        }
      }

      try {
        let files = [];
        let lastError;
        for (const folder of folders) {
          try { files = await loadFiles(folder); break; }
          catch (error) { lastError = error; }
        }
        if (!files.length && lastError && !files.length) {
          // If both directory spellings are absent, show the useful API error below.
          const checkLower = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/blogs?ref=main`);
          if (!checkLower.ok) throw lastError;
        }

        posts = await Promise.all(files.map(async (file) => {
          const response = await fetch(file.download_url);
          if (!response.ok) throw new Error(`Could not read ${file.name}.`);
          const parsed = parseMarkdown(await response.text());
          const filenameTitle = file.name.replace(/\.md$/i, '').replace(/[-_]/g, ' ');
          const dateValue = parsed.metadata.date || '';
          return {
            title: parsed.metadata.title || filenameTitle,
            date: formatDate(dateValue),
            sortDate: dateValue ? Date.parse(dateValue) || 0 : 0,
            filename: file.name,
            downloadUrl: file.download_url
          };
        }));
        posts.sort((a, b) => b.sortDate - a.sortDate || a.title.localeCompare(b.title));
        await renderRoute();
      } catch (error) {
        status.textContent = 'Could not load blog posts. Confirm the Markdown files are in Blogs/ or blogs/ on the main branch and that the repository is public.';
        console.error('Blog loader error:', error);
      }

      window.addEventListener('hashchange', renderRoute);
    })();
  </script>
</body>
</html>
