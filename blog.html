<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog posts by Shiv Gurjar.">
  <title>Blog | Shiv Gurjar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17212b;
      --muted: #263b4d;
      --paper: #42a5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Newsreader', Georgia, serif;
    }

    .page {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 38px 36px 64px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 0.95rem;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    h1 {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: 0;
      color: var(--ink);
      font-size: 2rem;
      font-weight: 500;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .page { padding: 28px 20px 48px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">← Home</a>
    <h1 id="random-heading">Blog test</h1>
  </main>

  <script>
    // Temporary visual test: place the heading at a random point on the page.
    const heading = document.getElementById('random-heading');
    const margin = 12;
    heading.style.left = `${margin + Math.random() * (100 - margin * 2)}%`;
    heading.style.top = `${margin + Math.random() * (100 - margin * 2)}vh`;
  </script>
</body>
</html>
