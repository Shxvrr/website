<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Shiv Gurjar</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --text: #4c5360;
      --heading: #4c5360;
      --muted: #7d8591;
      --line: rgba(96, 105, 117, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 44px 32px 80px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 28px;
      color: var(--muted);
      text-decoration: none;
      font-size: 1rem;
      font-family: Arial, sans-serif;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .blog-page {
      max-width: 820px;
      margin-left: 0;
    }

    .title {
      font-size: clamp(2.5rem, 4vw, 5rem);
      line-height: 1.05;
      font-weight: 400;
      color: var(--heading);
      letter-spacing: -0.04em;
      margin: 0 0 12px;
    }

    .post-list {
      list-style: none;
      padding: 0;
      margin: 40px 0 0;
    }

    .post-item {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .post-link {
      display: block;
      text-decoration: none;
      color: var(--heading);
      font-size: clamp(2rem, 3vw, 3.1rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
      font-weight: 400;
    }

    .post-date {
      display: block;
      color: var(--muted);
      font-size: clamp(1.1rem, 1.7vw, 1.8rem);
      font-style: normal;
      font-family: Georgia, serif;
    }

    @media (max-width: 640px) {
      .container {
        padding: 28px 18px 50px;
      }

      .post-link {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="index.html">← Home</a>

    <div class="blog-page">
      <h1 class="title">Blog</h1>

      <ul class="post-list">
        <li class="post-item">
          <a class="post-link" href="#">Mutable nature</a>
          <span class="post-date">May 20, 2026</span>
        </li>

        <li class="post-item">
          <a class="post-link" href="#">Hamilton is not real</a>
          <span class="post-date">January 1, 2026</span>
        </li>

        <li class="post-item">
          <a class="post-link" href="#">Armed prophets</a>
          <span class="post-date">December 10, 2025</span>
        </li>

        <li class="post-item">
          <a class="post-link" href="#">Harvard-Yale 2</a>
          <span class="post-date">November 23, 2025</span>
        </li>

        <li class="post-item">
          <a class="post-link" href="#">Big brain into believing anything</a>
          <span class="post-date">November 14, 2025</span>
        </li>

        <li class="post-item">
          <a class="post-link" href="#">Cornell: Stolen bike</a>
          <span class="post-date">November 3, 2025</span>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
