<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog posts by Shiv Gurjar.">
  <meta name="theme-color" content="#42a5f5">
  <title>Blog | Shiv Gurjar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17212b;
      --muted: #263b4d;
      --paper: #eef3f7;
      --accent: #42a5f5;
      --rule: rgba(23, 33, 43, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Newsreader', Georgia, serif;
      line-height: 1.65;
    }

    .page {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 36px 24px 72px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.96rem;
      text-decoration: none;
    }

    .back-link:hover,
    .post-link:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--ink);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
      line-height: 1.15;
    }

    .status {
      color: var(--muted);
      margin: 0 0 22px;
      font-size: 1rem;
    }

    .post-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-width: 760px;
    }

    .post-list li {
      margin: 0 0 24px;
    }

    .post-link {
      color: var(--ink);
      font-size: 1.42rem;
      line-height: 1.35;
      text-decoration: none;
      font-weight: 500;
    }

    .post-date {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.96rem;
    }

    .post-content {
      max-width: 760px;
      font-size: 1.18rem;
      overflow-wrap: anywhere;
    }

    .post-content h2,
    .post-content h3,
    .post-content h4 {
      margin: 1.5em 0 0.5em;
      line-height: 1.25;
    }

    .post-content p {
      margin: 0 0 1.2em;
    }

    .post-content ul,
    .post-content ol {
      padding-left: 1.5em;
    }

    .post-content blockquote {
      margin: 1.25em 0;
      padding-left: 1em;
      border-left: 3px solid var(--rule);
      color: var(--muted);
    }

    .post-content pre {
      background: rgba(255,255,255,0.28);
      border-radius: 6px;
      padding: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .post-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .post-content img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1em 0;
    }

    @media (max-width: 600px) {
      .page {
        padding: 28px 20px 48px;
      }

      .post-link {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back-link" id="back-link" href="../index.html">← Home</a>
    <h1 id="page-title">Blog</h1>

    <p class="status" id="status">Loading posts…</p>

    <ul class="post-list" id="post-list" aria-label="Blog posts"></ul>
    <article class="post-content" id="post-content" hidden></article>
  </main>

  <script>
    (async function () {
      const repo = 'Shxvrr/website';
      const folderNames = ['Blogs'];
      const list = document.getElementById('post-list');
      const status = document.getElementById('status');
      const titleElement = document.getElementById('page-title');
      const contentElement = document.getElementById('post-content');
      const backLink = document.getElementById('back-link');
      let posts = [];

      function escapeHtml(text) {
        return text.replace(/[&<>\"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char]);
      }

      function parseMarkdown(markdown) {
        const match = markdown.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n|$)/);
        const metadata = {};
        let source = markdown;

        if (match) {
          match[1].split(/\r?\n/).forEach((line) => {
            const field = line.match(/^([\w-]+):\s*(.*?)\s*$/);
            if (field) metadata[field[1].toLowerCase()] = field[2].replace(/^['"]|['"]$/g, '');
          });
          source = markdown.slice(match[0].length);
        }

        const inline = (text) => {
          let html = escapeHtml(text);
          html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
          html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
          html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                     .replace(/\*(.+?)\*/g, '<em>$1</em>');
          return html;
        };

        const output = [];
        let paragraph = [];
        let items = [];
        let code = null;

        const flushParagraph = () => {
          if (paragraph.length) output.push(`<p>${paragraph.map(inline).join('<br>')}</p>`);
          paragraph = [];
        };

        const flushList = () => {
          if (items.length) output.push(`<ul>${items.map(item => `<li>${inline(item)}</li>`).join('')}</ul>`);
          items = [];
        };

        for (const line of source.replace(/\r\n/g, '\n').split('\n')) {
          if (code) {
            if (/^\s*```/.test(line)) {
              output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
              code = null;
            } else {
              code.push(line);
            }
            continue;
          }

          if (/^\s*```/.test(line)) {
            flushParagraph();
            flushList();
            code = [];
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            flushList();
            const level = Math.min(heading[1].length + 1, 6);
            output.push(`<h${level}>${inline(heading[2])}</h${level}>`);
            continue;
          }

          const item = line.match(/^\s*[-*+]\s+(.+)$/);
          if (item) {
            flushParagraph();
            items.push(item[1]);
            continue;
          }

          const quote = line.match(/^>\s?(.*)$/);
          if (quote) {
            flushParagraph();
            flushList();
            output.push(`<blockquote><p>${inline(quote[1])}</p></blockquote>`);
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            flushList();
            continue;
          }

          flushList();
          paragraph.push(line);
        }

        if (code) output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
        flushParagraph();
        flushList();

        return { metadata, html: output.join('\n') };
      }

      function slugFor(filename) {
        return filename
          .replace(/\.md$/i, '')
          .normalize('NFKD')
          .replace(/[^\w-]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .toLowerCase();
      }

      function formatDate(value) {
        if (!value) return '';
        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? value
          : date.toLocaleDateString('en-US', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              timeZone: 'UTC'
            });
      }

      function showList() {
        titleElement.textContent = 'Blog';
        backLink.href = '../index.html';
        backLink.textContent = '← Home';
        contentElement.hidden = true;
        list.hidden = false;
        status.hidden = true;
        list.replaceChildren();

        if (!posts.length) {
          status.textContent = 'No Markdown posts found in the Blogs folder.';
          status.hidden = false;
          return;
        }

        posts.forEach((post) => {
          const item = document.createElement('li');

          const link = document.createElement('a');
          link.className = 'post-link';
          link.href = `/blog/?post=${encodeURIComponent(post.slug)}`;
          link.textContent = post.title;

          const date = document.createElement('span');
          date.className = 'post-date';
          date.textContent = post.displayDate;

          item.append(link, date);
          list.appendChild(item);
        });
      }

      function showPost(slug) {
        const post = posts.find((item) => item.slug === slug);
        if (!post) {
          showList();
          return;
        }

        list.hidden = true;
        status.hidden = true;
        contentElement.hidden = false;
        titleElement.textContent = post.title;
        backLink.href = '/blog/';
        
        backLink.textContent = '← All posts';

        contentElement.innerHTML = post.html;

        if (post.displayDate) {
          const date = document.createElement('p');
          date.className = 'post-date';
          date.textContent = post.displayDate;
          contentElement.prepend(date);
        }
      }

      try {
        let entries = null;
        let lastError = null;

        for (const folder of folderNames) {
          const response = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}?ref=main`, {
            headers: { Accept: 'application/vnd.github+json' }
          });

          if (response.ok) {
            entries = await response.json();
            break;
          }

          lastError = new Error(`Could not load ${folder}/ (${response.status}).`);
        }

        if (!entries) throw lastError || new Error('Could not find the Blogs folder.');

        const files = entries.filter((entry) => entry.type === 'file' && /\.md$/i.test(entry.name));

        posts = await Promise.all(files.map(async (file) => {
          const response = await fetch(file.download_url);
          if (!response.ok) throw new Error(`Could not read ${file.name}.`);

          const parsed = parseMarkdown(await response.text());
          const dateValue = parsed.metadata.date || '';

          return {
            title: parsed.metadata.title || file.name.replace(/\.md$/i, '').replace(/[-_]/g, ' '),
            slug: slugFor(file.name),
            displayDate: formatDate(dateValue),
            sortDate: Date.parse(dateValue) || 0,
            html: parsed.html
          };
        }));

        posts.sort((a, b) => b.sortDate - a.sortDate || a.title.localeCompare(b.title));

        const slug = new URLSearchParams(location.search).get('post');
        if (slug) showPost(slug);
        else showList();

      } catch (error) {
        list.hidden = true;
        status.textContent = 'Could not load posts. Check that the Blogs folder and Markdown files are on the main branch and the repository is public.';
        status.hidden = false;
        console.error('Blog loading error:', error);
      }
    })();
  </script>
</body>
</html>
